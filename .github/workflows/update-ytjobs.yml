name: Update YT Jobs stats

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas
  workflow_dispatch:         # botón "Run workflow" para actualizar a mano

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch stats from YT Jobs
        run: node scripts/update-ytjobs.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/ytjobs.json; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ytjobs.json
          git commit -m "Update YT Jobs stats"
          git push
